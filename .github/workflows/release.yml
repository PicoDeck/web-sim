# A pushed vX.Y.Z tag: build and test against the latest PicoDeck release,
# publish picodeck-web-sim.zip, and rebuild picodeck.net.
#
# Run by hand (Actions > release > Run workflow), on main only (a run on
# another branch is refused), to release against a chosen PicoDeck ref:
# `version` is the new vX.Y.Z, greater than web-sim's latest release (its
# tag must not exist yet: publish.sh creates it on the commit the run was
# dispatched from; both are checked before the build) and `picodeck_ref` a
# PicoDeck tag, branch or commit (empty = the usual resolution: the latest
# release with the web build seam, else picodeck.pin).
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: The web-sim version to release, vX.Y.Z (a new tag, created on this run's commit)
        type: string
        required: true
      picodeck_ref:
        description: PicoDeck tag, branch or commit to build against (empty = the latest release with the web build seam, else picodeck.pin)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # The version being released: the pushed tag as it is, or a manual run's
  # input, checked before the build so a mistake fails in seconds:
  # scripts/release-version.mjs refuses a version that isn't vX.Y.Z, whose
  # tag already exists, or that isn't greater than web-sim's latest release
  # (read-only lookups with this job's contents: read token).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pushed.outputs.version || steps.manual.outputs.version }}
    steps:
      - name: The pushed tag
        id: pushed
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=$TAG" >> "$GITHUB_OUTPUT"
      # A manual release tags the commit it runs on: only main's.
      - name: Check the run is on main
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::a manual release runs only on main, not $REF: choose main under \"Use workflow from\""
            exit 1
          fi
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
      - name: Check the version
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs "$VERSION"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      web_sim_version: ${{ needs.version.outputs.version }}
      picodeck_ref: ${{ inputs.picodeck_ref || '' }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAVE_PAGES_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: web-sim
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/publish.sh "$TAG"
      # A manual run tags the commit it was dispatched from (and built: the
      # build's checkout is the same github.sha). No --rebuilt: it is not a
      # follow release. publish.sh refuses an existing release or tag.
      - name: Publish ${{ needs.version.outputs.version }} on ${{ github.sha }}
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.version }}
          TARGET: ${{ github.sha }}
        run: scripts/publish.sh "$TAG" "$TARGET"
      - name: Rebuild picodeck.net
        if: env.HAVE_PAGES_HOOK == 'true'
        env:
          PAGES_DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$PAGES_DEPLOY_HOOK" > /dev/null
