# Follows PicoDeck's releases: when PicoDeck publishes one (its release.yml
# sends `picodeck-release` with the tag, or the daily check finds it), rebuild
# web-sim's latest release (its tag's commit, never unreleased work on main)
# against it, test it and, if everything passes, publish it as the next patch
# release. A failure publishes nothing: picodeck.net keeps the previous demo.
# Run by hand (Actions > follow-picodeck > Run workflow) on main only: a run
# on another branch is refused.
name: follow-picodeck

on:
  repository_dispatch:
    types: [picodeck-release]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: follow-picodeck

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      follow: ${{ steps.decide.outputs.follow }}
      picodeck_ref: ${{ steps.decide.outputs.picodeck_ref }}
      next: ${{ steps.decide.outputs.next }}
      web_sim_ref: ${{ steps.decide.outputs.web_sim_ref }}
    steps:
      # A manual run publishes a real release with this branch's workflows
      # and scripts: only main's, as release.yml's manual path. Schedule and
      # repository_dispatch runs are always on the default branch.
      - name: Check the run is on main
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::a manual follow runs only on main, not $REF: choose main under \"Use workflow from\""
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Is there a newer PicoDeck release?
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The tag PicoDeck dispatched (empty on the schedule and manual
          # runs): should-follow waits for releases/latest to name it.
          EXPECT_PICODECK_TAG: ${{ github.event.client_payload.tag }}
        run: node scripts/should-follow.mjs

  build:
    needs: check
    if: needs.check.outputs.follow == 'true'
    uses: ./.github/workflows/build.yml
    with:
      picodeck_ref: ${{ needs.check.outputs.picodeck_ref }}
      web_sim_version: ${{ needs.check.outputs.next }}
      web_sim_ref: ${{ needs.check.outputs.web_sim_ref }}

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAVE_PAGES_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK != '' }}
    steps:
      # The web-sim release the build rebuilt: its commit is the new tag's target.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.web_sim_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: web-sim
      # This workflow's own scripts (main's), for the check below: the
      # rebuilt release's checkout above may predate release-version.mjs.
      - uses: actions/checkout@v4
        with:
          path: follow-tools
          persist-credentials: false
      # Just before publishing: the release this follow rebuilt must still be
      # web-sim's latest, and next still a new tag greater than it. A release
      # that landed during the follow (by hand) would otherwise be overtaken
      # as "latest" by this follow's lower version. Read-only lookups.
      - name: Check ${{ needs.check.outputs.web_sim_ref }} is still web-sim's latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.check.outputs.next }}
          WEB_SIM_REF: ${{ needs.check.outputs.web_sim_ref }}
        run: node follow-tools/scripts/release-version.mjs "$NEXT" --follow "$WEB_SIM_REF"
      # --rebuilt adds "Rebuilt for PicoDeck <ref>." to the notes. This is the
      # release's own publish.sh; one older than the flag ignores it and adds
      # the line anyway (it did so for any target).
      - name: Publish ${{ needs.check.outputs.next }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.next }}
        run: scripts/publish.sh "$TAG" "$(git rev-parse HEAD)" --rebuilt
      - name: Rebuild picodeck.net
        if: env.HAVE_PAGES_HOOK == 'true'
        env:
          PAGES_DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$PAGES_DEPLOY_HOOK" > /dev/null
